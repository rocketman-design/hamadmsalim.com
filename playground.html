<script>
(() => {
  const d = document.documentElement; d.classList.add('js');
  try { if (!sessionStorage.getItem('hms-sun')) { d.classList.add('sunrise'); sessionStorage.setItem('hms-sun', '1'); } } catch (e) {}
  addEventListener('pagereveal', (e) => {
    if (!e.viewTransition) return;
    document.querySelectorAll('.fade, .draw, .unveil').forEach((el) => { if (el.getBoundingClientRect().top < innerHeight) el.classList.add('in', 'now'); });
  });
  // Keep the header still through a page change only when it is on screen; otherwise let it fade with the page.
  addEventListener('pageswap', (e) => { const t = document.querySelector('.top'); if (e.viewTransition && t && scrollY > 64) t.style.viewTransitionName = 'none'; });
})();
